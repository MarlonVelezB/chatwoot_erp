<div class="cw-app">
  <aside class="cw-sidebar">
    <div class="cw-sidebar-header">
      <div class="cw-brand">
        <svg class="cw-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>Chatwoot</span>
      </div>
      <div class="cw-header-actions">
        <button class="cw-icon-btn" id="cw-search-btn" title="Buscar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <button class="cw-icon-btn" id="cw-compose-btn" title="Nueva conversación">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
      </div>
    </div>

    <nav class="cw-nav">
      <a class="cw-nav-item" data-section="mine" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
        <span>Mi bandeja</span>
        <span class="cw-badge" id="badge-mine"></span>
      </a>

      <div class="cw-nav-group">
        <div class="cw-nav-group-header" id="conversations-toggle">
          <div class="cw-nav-item-inner">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span>Conversaciones</span>
          </div>
          <svg class="cw-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div class="cw-nav-children" id="conversations-children">
          <a class="cw-nav-child active" data-section="all" href="#">Todas</a>
          <a class="cw-nav-child" data-section="mentions" href="#">Menciones</a>
          <a class="cw-nav-child" data-section="unattended" href="#">Desatendido</a>
        </div>
      </div>

      <a class="cw-nav-item" data-section="contacts" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>Contactos</span>
      </a>

      <a class="cw-nav-item" data-section="reports" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        <span>Informes</span>
      </a>

      <a class="cw-nav-item" data-section="campaigns" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l19-9-9 19-2-8-8-2z"/></svg>
        <span>Campañas</span>
      </a>
    </nav>

    <div class="cw-sidebar-footer">
      <a class="cw-nav-item" data-section="settings" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
        <span>Ajustes</span>
      </a>
    </div>
  </aside>

  <main class="cw-main">
    <div class="cw-conversations-panel" id="cw-conversations-panel">
      <div class="cw-panel-header">
        <h2 class="cw-panel-title" id="cw-panel-title">Todas las conversaciones</h2>
        <div class="cw-filter-row">
          <input class="cw-search-input" id="cw-conv-search" type="text" placeholder="Buscar conversaciones…">
        </div>
      </div>
      <div class="cw-conv-list" id="cw-conv-list">
        <div class="cw-empty-state">Cargando…</div>
      </div>
    </div>

    <div class="cw-chat-panel" id="cw-chat-panel">
      <div class="cw-chat-empty" id="cw-chat-empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <p>Selecciona una conversación</p>
      </div>

      <div class="cw-chat-inner" id="cw-chat-inner" style="display:none">
        <div class="cw-chat-header" id="cw-chat-header"></div>
        <div class="cw-messages" id="cw-messages"></div>
        <div class="cw-composer">
          <textarea class="cw-composer-input" id="cw-composer-input" placeholder="Escribe un mensaje…" rows="2"></textarea>
          <div class="cw-composer-actions">
            <button class="cw-btn-resolve" id="cw-btn-resolve">Resolver</button>
            <button class="cw-btn-send" id="cw-btn-send">Enviar</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
